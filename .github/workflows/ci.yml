name: Проверка

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run verify
      - name: Проверить production-зависимости
        run: npm audit --omit=dev
      - name: Собрать production-образ
        run: docker build -t prozor:test .
