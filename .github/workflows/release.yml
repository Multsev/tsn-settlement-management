name: Релиз

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Проверить и опубликовать релиз
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить проект
        run: npm run verify
      - name: Проверить production-зависимости
        run: npm audit --omit=dev
      - name: Собрать production-образ
        run: docker build -t tsn-management:${{ github.ref_name }} .
      - name: Сверить версию тега с package.json
        run: |
          test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "ТСН: Управление посёлком $GITHUB_REF_NAME"
