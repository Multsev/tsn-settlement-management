services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prozor
      POSTGRES_USER: prozor
      POSTGRES_PASSWORD: prozor
    ports:
      - '5432:5432'
    volumes:
      - prozor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prozor -d prozor']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    profiles: [production]
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://prozor:prozor@postgres:5432/prozor?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/storage/uploads
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '3000:3000'
    volumes:
      - prozor-files:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prozor-postgres:
  prozor-files:
