name: tsn-management

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tsn_management
      POSTGRES_USER: tsn_app
      POSTGRES_PASSWORD: tsn_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tsn-management-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsn_app -d tsn_management']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    profiles: [production]
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tsn_app:tsn_local@postgres:5432/tsn_management?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/storage/uploads
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '3000:3000'
    volumes:
      - tsn-management-files:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tsn-management-postgres:
    name: tsn-management-postgres
  tsn-management-files:
    name: tsn-management-files
